name: Continuous Integration

env:
  RUST_LOG: info
  RUST_BACKTRACE: 1
  BAZEL_STARTUP_FLAGS: --bazelrc=${{ github.workspace }}/.github/github.bazelrc

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    name: Test
    strategy:
      matrix:
        runner:
          #- windows-latest  # windows
          - macos-latest    # macos
          #- ubuntu-latest   # linux
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: bazel build ...
      - name: Test
        run: bazel test ...