name: Continuous Integration

env:
  RUST_LOG: info
  RUST_BACKTRACE: 1
  BAZEL_STARTUP_FLAGS: --bazelrc=${{ github.workspace }}/.github/github.bazelrc

on:
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  test:
    name: Test
    strategy:
      matrix:
        runner:
          #- windows-latest  # windows
          - macos-latest    # macos
          #- ubuntu-latest   # linux
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Build
        run: bazel build ...
      - name: Test
        run: bazel test ...